spring.application.name=urbantwin-backend
server.port=8082

# PostgreSQL (Neon Cloud)
spring.datasource.url=${POSTGRES_JDBC_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flask Simulation Engine URL
simulation.engine.url=${FLASK_SIM_URL:http://localhost:5001}

# CORS allowed origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.urbantwin=DEBUG
logging.level.org.hibernate.SQL=WARN
